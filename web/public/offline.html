<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6a6f">
<title>Sin conexión · Portal de Pedidos</title>
<style>
  :root{--bg:#f3f5f7;--surface:#fff;--ink:#15202b;--ink-2:#4d5b69;--line:#dde2e8;--accent:#0b6a6f;--accent-ink:#fff}
  @media (prefers-color-scheme: dark){:root{--bg:#0f151b;--surface:#161e26;--ink:#e7edf2;--ink-2:#a9b6c2;--line:#2a3642;--accent:#4cb7b9;--accent-ink:#06282a}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;text-align:center}
  img{width:56px;height:56px;border-radius:12px}
  h1{font-size:20px;margin:12px 0 4px}
  p{color:var(--ink-2);margin:0 0 16px}
  button{border:0;border-radius:8px;padding:10px 18px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600}
</style>
</head>
<body>
  <main class="card">
    <img src="/icon-192.png" alt="">
    <h1>Sin conexión</h1>
    <p>No hay internet ahora mismo. Tus pedidos y facturas aparecerán en cuanto vuelva la conexión.</p>
    <button onclick="location.reload()">Reintentar</button>
  </main>
  <script>addEventListener("online", () => location.reload());</script>
</body>
</html>
